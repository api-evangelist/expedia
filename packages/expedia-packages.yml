method: searched
source: >-
  Maven Central (search.maven.org/solrsearch, group com.expediagroup), the npm registry
  (registry.npmjs.org, scope @expediagroup), PyPI (pypi.org/pypi/<name>/json), and the ExpediaGroup
  GitHub organization repository listing (api.github.com/orgs/ExpediaGroup/repos).
ownership: >-
  These libraries are published by Expedia Group under the com.expediagroup Maven group, the
  @expediagroup npm scope and the github.com/ExpediaGroup organization. Expedia (expedia.com) is a
  brand of Expedia Group and this repository is the brand alias for that estate — the canonical
  catalog of the underlying APIs is api-evangelist/expedia-group. Recorded here as the parent-brand
  case: the client libraries a developer integrating any Expedia brand would install are Expedia
  Group's, and Expedia Group publishes no separate expedia.com-branded SDK.
note: >-
  CURRENCY IS THE FINDING. Every first-party Expedia Group API SDK on a registry was last published
  in 2024 or 2025 — the newest API client, xap-sdk, is a 2.0.0-alpha from 2025-06-05, and the shared
  SDK foundation packages (expediagroup-sdk-core / -rest / -graphql) are all 0.0.x alphas. The only
  package released in 2026 is @expediagroup/expedia-openclaw, an agent-facing search plugin, which
  is where the investment moved.
