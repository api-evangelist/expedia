deployment_note: >-
  THERE IS NO HOSTED EXPEDIA MCP ENDPOINT. This server ships as a Python package the consumer installs
  and runs. It supports two transports — `stdio` for LLM clients and `streamable-http` for web clients —
  but the streamable-http listener binds to the OPERATOR'S OWN machine (http://0.0.0.0:9900/mcp in the
  project README), so it is a self-hosted transport option, not an Expedia-operated agent surface. Mode
  is therefore local-stdio, not remote and not both: an agent cannot reach Expedia over MCP today
  without a human first installing and running this package and supplying a key.
  Expedia Group's own AI Solutions page (https://developers.expediagroup.com/docs/ai-solutions,
  fetched 2026-09-07, HTTP 200) states it is "building MCP capabilities that work seamlessly with our
  APIs" and is in "the exploration phase" — i.e. the partner-facing hosted MCP server announced in the
  trade press in May 2026 had not shipped a public endpoint as of this probe. No endpoint URL is
  recorded here because none was observed; a guessed MCP path is never written.
authentication:
  scheme: api-key
  mechanism: EXPEDIA_API_KEY environment variable read by the server process
  note: >-
    The key is for the upstream Expedia Travel Recommendation Service, which is partner-gated. The MCP
    server itself performs no authorization; it forwards the operator's key.
