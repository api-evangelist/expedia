  addressable anonymously, the partner lodging GraphQL surface, returns 401 with an empty body and no
  RateLimit-* or Retry-After header, so nothing could be observed at runtime either. Third-party
  summaries describe a 50 TPS per-connectivity-partner ceiling; that figure is NOT recorded as a limit
  here because it could not be traced to a page Expedia serves in readable form, and an unverifiable
  number is worse than an honest zero.
