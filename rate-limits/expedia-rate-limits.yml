note: >-
  NO RATE LIMIT COULD BE READ FROM A FIRST-PARTY SURFACE. This is an unreadable-docs result, not an
  absence of limits. Expedia Group's connectivity documentation is a JavaScript-rendered single-page
  application that returns a ~190KB HTML shell with no prose to a crawler, and its own rate-limits path
