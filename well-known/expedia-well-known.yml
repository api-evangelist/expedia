security_txt:
  served: true
  url: https://www.expedia.com/.well-known/security.txt
  contact: RespDisc@expedia.com
  policy: https://www.expediagroup.com/about/privacy-data-handling-requirements/
  hiring: https://lifeatexpedia.com/
  rfc9116_expires_present: false
  defects:
  - >-
    The Policy: URL is DEAD. https://www.expediagroup.com/about/privacy-data-handling-requirements/
    301s to https://www.expediagroup.com/en-us/our-story, which itself returns HTTP 404. A researcher
    following Expedia's own security.txt lands on a Page Not Found. Probed 2026-09-07.
  - >-
    No Expires: field. RFC 9116 section 2.5.5 makes Expires REQUIRED; a security.txt without it is
    non-conformant and cannot be aged out by an automated consumer.
